; ahk-tiler configuration. Lines starting with ; are comments.
; Hotkey syntax is AutoHotkey's: ! = Alt, + = Shift, ^ = Ctrl, # = Win.
; Edit, then press Alt+Shift+R (reload) -- no need to touch tiler.ahk.

[general]
; gap between windows = 2 * padding_inner; gap to screen edge = padding_outer + padding_inner
padding_outer=6
padding_inner=6
workspaces=9
; coloured frame (Windows 11 only; silently ignored on Windows 10)
border=1
border_focus=8dbcff
border_unfocus=a1a1a1
; 0 = windows already open at start go to the active workspace;
; 1 = the [rules] section also applies to them
apply_rules_on_start=0
; debug=1 writes tiler.log and listens to tiler.cmd (for automated tests)
debug=0
; if set, ONLY windows whose title starts with this text are managed (testing)
test_title_prefix=

[bar]
enabled=1
; top or bottom
position=top
; height in pixels at 100% scale
height=28
font=JetBrains Mono
font_size=13
hide_empty_workspaces=1
; any of: cpu,ram,battery,date,time (battery only shows when one exists)
right=cpu,ram,battery,date,time
; Ashes palette (same family the komorebi bar used)
color_bg=1c2023
color_chip=393f45
color_fg=c7ccd1
color_dim=747c84
color_accent=ae95c7

; ---------------------------------------------------------------------
; Windows that are never managed. Format:  kind:pattern=1
; kinds: exe (exact), class (exact), title (substring), titlere / classre (regex)
[ignore]
exe:zebar.exe=1
exe:Lively.exe=1
titlere:(?i)picture.in.picture=1

; Windows that are managed but start floating
[float]
exe:Taskmgr.exe=1
exe:SystemSettings.exe=1
exe:mmc.exe=1
exe:CalculatorApp.exe=1

; New windows of these programs open on the given workspace. Format: kind:pattern=workspace
[rules]
exe:zen.exe=1
exe:Code.exe=1
exe:claude.exe=2
exe:ChatGPT.exe=2
exe:WindowsTerminal.exe=2
exe:Obsidian.exe=4
exe:Spotify.exe=5

; ---------------------------------------------------------------------
; Format:  hotkey=action
[hotkeys]
!h=focus_left
!Left=focus_left
!l=focus_right
!Right=focus_right
!k=focus_up
!Up=focus_up
!j=focus_down
!Down=focus_down

!+h=move_left
!+Left=move_left
!+l=move_right
!+Right=move_right
!+k=move_up
!+Up=move_up
!+j=move_down
!+Down=move_down

!u=resize_h_dec
!p=resize_h_inc
!o=resize_v_inc
!i=resize_v_dec

!r=promote
!+Space=toggle_float
!t=toggle_float
!m=minimize
!+q=close
!f=toggle_monocle
!+v=cycle_layout
!x=flip_h
!y=cycle_focus

!s=ws_next
!a=ws_prev
!d=ws_last
!1=goto_1
!2=goto_2
!3=goto_3
!4=goto_4
!5=goto_5
!6=goto_6
!7=goto_7
!8=goto_8
!9=goto_9
!+1=movews_1
!+2=movews_2
!+3=movews_3
!+4=movews_4
!+5=movews_5
!+6=movews_6
!+7=movews_7
!+8=movews_8
!+9=movews_9

!+a=monitor_prev
!+f=monitor_next

!+x=retile
!+p=pause
!+r=reload
!+e=quit
; panic: restores every hidden window and exits
^!+Esc=quit

; ---------------------------------------------------------------------
; Format:  hotkey=command line to run
[launch]
!Enter=wt.exe
